<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurs Języka Polskiego - Menu</title>
    <style>
        :root {
            --primary: #4a90e2;
            --background: #f1f5f9;
            --text: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            padding: 16px;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 20px;
            color: #0f172a;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 14px 16px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        /* Ефект при натисканні на телефоні */
        .menu-item:active {
            background: #edf2f7;
            transform: scale(0.98);
        }

        .menu-item::after {
            content: "➔";
            color: var(--primary);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Lista Ćwiczeń </h1>
    
    <nav class="menu-list">
        <!-- Посилання на файли вправ, які лежать поруч -->
        <a href="cwiczenie1.html" class="menu-item">Ćwiczenie 1: Jedzenie i picie (Biernik i Dopełniacz)</a>
        <a href="cwiczenie2.html" class="menu-item">Ćwiczenie 2: (Interaktywne Ćwiczenia Językowe)</a>
        <a href="cwiczenie3.html" class="menu-item">Ćwiczenie 3: (Formę czasownika)</a>
         <a href="cwiczenie4.html" class="menu-item">Ćwiczenie 2: (/)</a>
        <a href="cwiczenie5.html" class="menu-item">Ćwiczenie 3: (/)</a>
    </nav>
</div>

</body>
</html>
